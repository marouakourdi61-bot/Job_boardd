<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/detail.css">
    <link rel="stylesheet" href="../css/header.css">

    <title>Détail de l'offre</title>
</head>

<body>

    <!-- Header -->
    <header>
        <div class="logo">StagesAlternances</div>

        <nav>
            <a href="../index.html" class="active">Offres</a>
            <a href="./offres-suivies.html">Suivies</a>
            <a href="./admin.html">Admin</a>
        </nav>
    </header>


    <div class="container">

        <!-- Lien de retour -->
        <a href="../index.html" class="back-link">
            &larr; Retour aux offres
        </a>


        <!-- Détail de l'offre -->
        <main class="detail-card">

            <span class="star-icon">★</span>

            <div class="offer-header-top">
                <span id="offer-type" class="badge-stage"></span>
                <span id="offer-date" class="date"></span>
            </div>

            <h1 id="offer-title" class="offer-title"></h1>

            <div id="offer-company" class="company-info"></div>

            <!-- Technologies -->
            <div id="offer-technologies" class="tags"></div>


            <!-- Mission -->
            <div class="section-title">
                Mission
            </div>

            <div id="offer-description" class="section-content"></div>


            <!-- Profil recherché -->
            <div class="section-title">
                Profil recherché
            </div>

            <div id="offer-profile" class="section-content"></div>


            <!-- Candidature -->
            <div class="section-title">
                Candidature
            </div>

            <div id="offer-application" class="section-content"></div>

        </main>

    </div>

    

    <script src="../js/detail.js"></script>

</body>

</html>
